# CLAUDE.md "Testing requirements": every commit must pass dotnet build and dotnet test.
# Runs on three operating systems so replay is also checked across machines (PROTOTYPE_PLAN criterion 2):
# the pinned-hash tests fail if any OS produces different quote bytes.
# CS2Integration is not in Regions.sln (it needs the game), so it is not built here.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (lock files must match)
        run: dotnet restore Regions.sln --locked-mode

      - name: Build
        run: dotnet build Regions.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Regions.sln --no-build --configuration Release --logger "console;verbosity=normal"
